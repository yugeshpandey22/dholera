<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 145" width="560" height="145" style="overflow: visible;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .logo-text {
        font-family: 'Outfit', 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 800;
        font-size: 84px;
        fill: #E3262A;
        letter-spacing: 1px;
      }
      .logo-subtext {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 19px;
        fill: #0F172A;
        letter-spacing: 0.5px;
      }
    </style>
    <filter id="pin-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Text: DH -->
  <text x="10" y="85" class="logo-text">DH</text>

  <!-- Center Pin (O replacement) -->
  <g transform="translate(142, 6)" filter="url(#pin-shadow)">
    <!-- Pin outer body -->
    <path d="M 52 0 C 23.3 0 0 23.3 0 52 C 0 78 40 118 52 130 C 64 118 104 78 104 52 C 104 23.3 80.7 0 52 0 Z" fill="#E3262A" />
    <path d="M 52 0 C 80.7 0 104 23.3 104 52 C 104 78 64 118 52 130 Z" fill="#D01B1F" />
    
    <!-- White Inner Window -->
    <circle cx="52" cy="50" r="38" fill="#FFFFFF" />

    <!-- Skyline Buildings inside pin -->
    <g transform="translate(26, 24)">
      <!-- Building 1 (Left - Blue) -->
      <rect x="3" y="24" width="18" height="26" fill="#38BDF8" rx="1" />
      <rect x="6" y="27" width="4" height="4" fill="#FFFFFF" />
      <rect x="13" y="27" width="4" height="4" fill="#FFFFFF" />
      <rect x="6" y="34" width="4" height="4" fill="#FFFFFF" />
      <rect x="13" y="34" width="4" height="4" fill="#FFFFFF" />
      <rect x="6" y="41" width="4" height="4" fill="#FFFFFF" />
      <rect x="13" y="41" width="4" height="4" fill="#FFFFFF" />

      <!-- Building 2 (Center - Orange/Yellow, tallest) -->
      <rect x="16" y="6" width="20" height="44" fill="#FBBF24" rx="1" />
      <polygon points="26,1 23,6 29,6" fill="#D97706" />
      <rect x="20" y="10" width="4" height="4" fill="#FFFFFF" />
      <rect x="28" y="10" width="4" height="4" fill="#FFFFFF" />
      <rect x="20" y="17" width="4" height="4" fill="#FFFFFF" />
      <rect x="28" y="17" width="4" height="4" fill="#FFFFFF" />
      <rect x="20" y="24" width="4" height="4" fill="#FFFFFF" />
      <rect x="28" y="24" width="4" height="4" fill="#FFFFFF" />
      <rect x="20" y="31" width="4" height="4" fill="#FFFFFF" />
      <rect x="28" y="31" width="4" height="4" fill="#FFFFFF" />
      <rect x="20" y="38" width="4" height="4" fill="#FFFFFF" />
      <rect x="28" y="38" width="4" height="4" fill="#FFFFFF" />

      <!-- Building 3 (Right - Coral Red) -->
      <rect x="33" y="18" width="16" height="32" fill="#F87171" rx="1" />
      <rect x="36" y="22" width="4" height="4" fill="#FFFFFF" />
      <rect x="42" y="22" width="4" height="4" fill="#FFFFFF" />
      <rect x="36" y="29" width="4" height="4" fill="#FFFFFF" />
      <rect x="42" y="29" width="4" height="4" fill="#FFFFFF" />
      <rect x="36" y="36" width="4" height="4" fill="#FFFFFF" />
      <rect x="42" y="36" width="4" height="4" fill="#FFFFFF" />
      
      <line x1="0" y1="50" x2="52" y2="50" stroke="#CBD5E1" stroke-width="2" />
    </g>
  </g>

  <!-- Right Text: LERA -->
  <text x="254" y="85" class="logo-text">LERA</text>

  <!-- Bottom Subtitle: Special Investment Region (Wide Viewbox, Fully Visible) -->
  <text x="250" y="122" class="logo-subtext">Special Investment Region</text>
</svg>
